<style data-page-node-id="RkCmTO9tmtWhRPHuvX9xR9" data-pnid-children="ZfTtC1YeG0jcZtVpZYRZns">
/* ============== 设计系统 ==============
   三档卡片：primary(主卡/深阴影+左侧主色条) / default(信息卡/细边) / soft(提示卡/无边框)
   间距节奏：section 24 / card 12 / inline 6-10
   圆角：12 / 16 / 20 / 24 四档
   配色：橙色只用在 CTA、active 状态、关键强调；标题与数字走深色系 */
:root{
  --orange:#EA580C;       /* 主色：橙红（比 F97316 更克制，仅 CTA/active/重点） */
  --orange-soft:#FFF1E6;  /* 主色底：浅暖 */
  --orange-line:#FFD9B8;  /* 主色线：暖橙 */
  --ink:#1E293B;          /* 主文本：近黑 */
  --ink-2:#475569;        /* 次文本：暖深灰 */
  --muted:#94A3B8;        /* 元信息：暖灰 */
  --line:#E8E1D4;         /* 细边框：暖米灰 */
  --line-soft:#EFEAE0;    /* 极细分隔线 */
  --bg:#FAF6F0;           /* 页面背景：暖白单色 */
  --card:#FFFFFF;
  --green:#16A34A; --green-soft:#F0FDF4;
  --red:#DC2626; --red-soft:#FEF2F2;
  --amber:#D97706; --amber-soft:#FEF3C7;
  --blue:#2563EB; --blue-soft:#EFF6FF;
  --purple:#9333EA; --purple-soft:#FAF5FF;
  --shadow-sm:0 1px 2px rgba(30,41,59,.04);
  --shadow:0 1px 2px rgba(30,41,59,.04),0 8px 20px -12px rgba(30,41,59,.10);
  --shadow-lg:0 1px 2px rgba(30,41,59,.04),0 18px 36px -20px rgba(234,88,12,.20);
}
::selection{background:#FFD9B8;color:#7C2D12}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);min-height:100dvh;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  letter-spacing:.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(234,88,12,.4);outline-offset:2px;border-radius:8px}
input,select,textarea{font-family:inherit;font-size:14px}
svg{display:inline-block;vertical-align:middle}

/* ============== 顶部 App 容器 ============== */
.app{max-width:1080px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px;letter-spacing:.02em}
.streak{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--orange);font-size:13px}
.streak.off{color:var(--muted)}
.streak svg{width:15px;height:15px}

/* ============== 导航 ============== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px;color:var(--muted);font-size:11px;min-height:56px;
  position:relative;transition:color .15s ease;
}
.tabbar button svg{width:21px;height:21px;stroke-width:1.8}
.tabbar button.on{color:var(--orange);font-weight:700}
.tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2.5px;background:var(--orange);border-radius:0 0 3px 3px}

/* ============== 卡片系统（三档） ============== */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);margin-bottom:8px}
.card h3,.card-primary h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.card h3 svg,.card-primary h3 svg{width:16px;height:16px;flex:none;color:var(--orange);stroke-width:2}
.card h3 .sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}

/* L1 主卡：左侧 3px 主色条 + 更大阴影，承载主要模块 */
.card-primary{
  background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--orange);
  border-radius:18px;padding:18px 20px;
  box-shadow:var(--shadow);
  margin-bottom:8px;position:relative;
}
/* L2 信息卡：默认样式 */
.card{}
/* L3 提示卡：米色无边框，用于次要/提示性内容 */
.card-soft{background:#FBF7F1;border:1px dashed #ECE2D2;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card-soft h3{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}

/* ============== section 分组（解决"组合在一起没设计感"的核心） ============== */
.section{margin-bottom:24px}
.section:last-child{margin-bottom:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.section-head h4{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.section-head h4::before{content:'';width:3px;height:13px;background:var(--orange);border-radius:2px;display:inline-block}
.section-head .meta{font-size:12px;color:var(--muted)}

/* ============== 通用原子 ============== */
.muted{color:var(--muted);font-size:12.5px;line-height:1.6}
.muted-2{color:var(--ink-2);font-size:13px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.all-clear{padding:18px 8px;text-align:center;color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.all-clear svg{width:16px;height:16px}

/* ============== 按钮 ============== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;
  background:var(--orange);color:#fff;
  box-shadow:0 4px 10px -5px rgba(234,88,12,.45);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  letter-spacing:.02em;
}
.btn.ghost{background:var(--orange-soft);color:var(--orange);box-shadow:none}
.btn.gray{background:#F1F5F9;color:var(--ink-2);box-shadow:none}
.btn.line{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.red{background:var(--red);box-shadow:none}
.btn.green{background:var(--green);box-shadow:none}
.btn.amber{background:var(--amber);box-shadow:none}
@media(hover:hover){
  .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 16px -8px rgba(234,88,12,.55)}
  .btn.ghost:not(:disabled):hover{background:#FFE5D0}
  .btn.gray:not(:disabled):hover{background:#E2E8F0}
  .btn.line:not(:disabled):hover{border-color:#C8B89E;background:#FBF7F1}
  .btn:not(:disabled):active{transform:translateY(0)}
}
.btn.sm{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.5)}
.btn.block{width:100%}

/* ============== 今天要处理 / 任务清单 ============== */
.todo-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  background:#FBF7F1;border:1px solid transparent;margin-bottom:8px;
  transition:background .12s ease;
}
.todo-item:last-child{margin-bottom:0}
.todo-item.urgent{background:#FEF2F2;border-color:#FECACA}
.todo-item .txt{flex:1;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.todo-item .txt b{font-size:14px;color:var(--ink);font-weight:700}
.todo-item.urgent .txt{color:var(--red)}
.todo-item.urgent .txt b{color:var(--red)}
.task-line{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;color:var(--ink-2)}
.task-line+.task-line{border-top:1px solid var(--line-soft)}
.task-line .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #DDD3BE;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.task-line .box svg{width:12px;height:12px}
.task-line.done .box{background:var(--green);border-color:var(--green);color:#fff}
.task-line.done span:last-child{color:var(--muted);text-decoration:line-through;text-decoration-color:#CBD5E1}

/* ============== 环形进度 ============== */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:26px;line-height:1;color:var(--ink);font-weight:800;letter-spacing:-.02em}
.ring .num span{font-size:11px;color:var(--muted);margin-top:3px}

/* ============== 打卡日历 ============== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{text-align:center;font-size:10px;color:var(--muted);padding-bottom:4px;font-weight:600;letter-spacing:.04em}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#F5EFE4;color:#C8B89E;font-size:12px;font-weight:600;position:relative}
.cal-day.l1{background:#FFE0BE;color:#9A3412}
.cal-day.l2{background:#FB923C;color:#fff}
.cal-day.l3{background:#EA580C;color:#fff}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--ink);font-weight:800;color:var(--ink)}
.cal-day.l1.today,.cal-day.l2.today,.cal-day.l3.today{color:inherit}
.cal-day.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--orange)}
.cal-stats{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.cal-mini-stats{display:flex;justify-content:space-around;font-size:11.5px;color:var(--ink-2);margin-top:20px;padding-top:10px;border-top:1px solid var(--line-soft);line-height:1.6}
.cal-mini-stats b{color:var(--ink);font-weight:700}
.cal-streak{font-size:12px;color:var(--muted);margin-bottom:36px;text-align:center;line-height:1.6}
.cal-streak b{color:var(--ink);font-weight:700;font-size:14px}
.cal-toggle{width:100%;min-height:32px;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:600;border-radius:8px}
.cal-toggle:hover{background:#F5EFE4}

/* ============== 倒计时（Hero 内的核心数据） ============== */
.cd-num{font-size:54px;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd-num span{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.cd-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.cd-date{font-size:12px;color:var(--ink-2);margin-top:4px}

/* ============== 进度条 ============== */
.bar{height:6px;border-radius:99px;background:#F1EADC;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FB923C,var(--orange));border-radius:99px;transition:width .3s ease}
.bar.dark i{background:var(--ink)}

/* ============== PC 端补充 ============== */
.hero{display:none}
.pc-only{display:none}
.week{display:flex;align-items:flex-end;gap:8px;height:159px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wnum{font-size:11px;color:var(--ink-2);min-height:14px;font-weight:600}
.wnum.empty{color:#C8B89E}
.wbar{width:100%;max-width:20px;border-radius:4px 4px 2px 2px;background:#F1EADC;min-height:4px;flex:0 0 auto}
.wbar.hot{background:linear-gradient(180deg,#FB923C,var(--orange))}
.wbar.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wlab{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.wlab.today{color:var(--ink);font-weight:700}
.cause-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
.cause-row+.cause-row{border-top:1px solid var(--line-soft)}
.cause-row .nm{width:60px;flex:none;color:var(--ink-2);font-weight:500}
.cause-row .bar{flex:1;height:6px;border-radius:99px;background:#F1EADC;overflow:hidden}
.cause-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FB923C,var(--orange))}
.cause-row b{width:30px;flex:none;text-align:right;font-weight:700;color:var(--ink)}
.guide-row{display:flex;gap:10px;padding:9px 0;font-size:13px;line-height:1.6;align-items:flex-start;color:var(--ink-2)}
.guide-row+.guide-row{border-top:1px solid var(--line-soft)}
.guide-row:last-child{padding-bottom:0}
.guide-row .chip-n{flex:none;font-weight:700;color:#fff;background:var(--orange);border-radius:6px;padding:2px 8px;font-size:11px;margin-top:1px;letter-spacing:.04em;min-width:42px;text-align:center}
.guide-row .chip-n.dim{background:#94A3B8}
.lv-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#F1EADC;margin:6px 0 10px}
.lv-bar i{display:block;height:100%;transition:width .3s ease}
.lv-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--muted)}
.lv-legend span{display:flex;align-items:center;gap:5px}
.lv-legend i{width:9px;height:9px;border-radius:2px;flex:none}
.lv-legend b{color:var(--ink);font-weight:700}

/* ============== 横幅 ============== */
.banner{
  display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid #FDE68A;
  color:#92400E;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;
}
.banner .grow{flex:1}
.banner .x{margin-left:6px;color:#92400E;font-size:18px;padding:4px 8px;opacity:.6;line-height:1}
.banner .x:hover{opacity:1}

/* ============== 表单 ============== */
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);
  transition:border-color .12s ease,box-shadow .12s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(234,88,12,.1)}
.field textarea{min-height:72px;resize:vertical;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============== 记录列表 ============== */
.log-item{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px}
.log-item+.log-item{border-top:1px solid var(--line-soft)}
.log-item .del{margin-left:auto;opacity:0;transition:opacity .15s ease}
.log-item:hover .del{opacity:1}
.tag{flex:none;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;letter-spacing:.02em}
.tag.listening{background:#FFEDD5;color:#C2410C}
.tag.reading{background:#DBEAFE;color:#1D4ED8}
.tag.writing{background:#DCFCE7;color:#15803D}
.tag.translating{background:#F3E8FF;color:#7E22CE}
.del{color:var(--muted);padding:8px;min-width:36px;min-height:36px;font-size:16px;line-height:1}
.del:hover{color:var(--red)}

/* ============== 错本 ============== */
.err-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:border-color .12s ease}
.err-item.due{border-color:#FCA5A5;background:#FFF8F8}
.err-item.due-strong{border-left:3px solid var(--red);background:#FFF8F8}
.err-item .q{font-size:13.5px;line-height:1.55;margin:8px 0 4px;color:var(--ink);font-weight:500}
.err-item .a{font-size:12.5px;color:var(--muted);line-height:1.55}
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;background:#F1F5F9;color:var(--ink-2);margin-right:4px;font-weight:600;letter-spacing:.02em}
.badge.red{background:#FEE2E2;color:var(--red)}
.badge.orange{background:#FFEDD5;color:#C2410C}
.badge.gray{background:#F1F5F9;color:var(--ink-2)}
.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-row select{flex:1;min-height:36px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:12.5px}

/* ============== 生词本 ============== */
.vocab-item{display:flex;align-items:center;gap:10px;padding:10px 0}
.vocab-item+.vocab-item{border-top:1px solid var(--line-soft)}
.vocab-item .w{font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.01em}
.vocab-item .ph{color:var(--muted);font-size:12.5px;margin-left:4px}
.vocab-item .d{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.vocab-item .actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.vocab-item .speak{color:var(--muted);padding:6px;border-radius:6px}
.vocab-item .speak:hover{color:var(--orange);background:var(--orange-soft)}

/* ============== 翻卡 overlay ============== */
.deck-mask{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  flex-direction:column;min-height:100dvh;
}
.deck-mask.show{display:flex}
.deck-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
.deck-top .prog{font-weight:700;color:var(--orange);font-size:13px;background:var(--orange-soft);padding:4px 12px;border-radius:99px}
.deck-close{font-size:13px;color:var(--ink-2);padding:8px 12px;min-width:44px;min-height:44px;border-radius:8px;font-weight:600}
.deck-close:hover{background:#F1EADC}
.flip-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px;perspective:1200px}
.flip{width:100%;max-width:420px;height:min(56dvh,420px);position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(30,41,59,.04),0 20px 50px -20px rgba(30,41,59,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;
}
.face.back{transform:rotateY(180deg)}
.face .word{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1;word-break:break-word;color:var(--ink)}
.face .phonetic{font-size:18px;color:var(--muted);margin-top:14px;letter-spacing:.02em}
.face .hint{position:absolute;bottom:22px;font-size:12px;color:#B7A98F;font-weight:500}
.face .pos{font-size:14px;color:var(--orange);font-weight:700;margin-bottom:10px;background:var(--orange-soft);padding:3px 10px;border-radius:6px;letter-spacing:.04em}
.face .def{font-size:24px;font-weight:700;line-height:1.4;color:var(--ink);letter-spacing:-.01em}
.face .coll{font-size:14px;color:var(--ink-2);margin-top:14px;line-height:1.5}
.face .eg{font-size:15px;margin-top:16px;line-height:1.65;color:var(--ink-2)}
.face .egcn{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.speak-btn{margin-top:14px;width:44px;height:44px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}
.speak-btn:hover{background:#FFE0BE;transform:scale(1.05)}

var DATABASE_ID = 'TGTwf18GWM6F0KjfGNz98R';
var ONLINE = false, LOCAL_ONLY = false;
try { if (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) { var db = window.__SMART_PAGE__.database; ONLINE = true; } } catch(e) {}

function pullRemote(cb){
  if (!ONLINE || LOCAL_ONLY) { if(cb) cb(false); return; }
  var all = [], cursor = null;
  function fetchPage(){
    db.query({ databaseId: DATABASE_ID, pageSize: 100, startCursor: cursor }).then(function(result){
      all = all.concat(result.results || []);

function mergeRemote(rows){

  rows.forEach(function(r){
    var wordText = r["Word"] || "";
    var w = null;
    for(var i=0;i<WORDS.length;i++){ if(WORDS[i].w===wordText){ w=WORDS[i]; break; } }

}

    props["Word"] = { text: rec.word };
    props["Status"] = { select: rec.status };
    props["ReviewInterval"] = { number: rec.interval };
    props["NextReview"] = { date: rec.next };
    db.addRecord({ databaseId: DATABASE_ID, properties: props }).catch(function(err){
      goLocalOnly("write failed");
    });
  } catch(e){ goLocalOnly("write error"); }
}

function goLocalOnly(reason){
  LOCAL_ONLY = true;
  console.warn("[database] " + reason);
}

function todayStr(d){d=d||new Date();const m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

const SCHEMA_VERSION=2;
function freshState(){
  return {
    version:SCHEMA_VERSION,
    settings:{examDate:'2026-12-19',level:'CET4',dailyNew:10},
    wordProgress:{},   // id -> {lv,next,dealt,wt:{d,n},sample?}
    vocabBook:{}, graduated:{},
    quizLogs:[], wrongBook:[],
    checkins:[], dayStats:{},
    meta:{installedSample:false,sampleTipDismissed:false,placementDone:false,dealtDate:'',lastOpenDate:'',backupRemindedAt:0,quizBest:null,clozeBest:null,sampleDates:[]}
  };
}
function isObj(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}
function isDateStr(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T00:00:00').getTime());}
function normalizeState(src,strict){
  if(!isObj(src)||!Number.isInteger(Number(src.version))||Number(src.version)<1||Number(src.version)>SCHEMA_VERSION)throw new Error('version');
  if(!isObj(src.settings)||!isObj(src.wordProgress))throw new Error('shape');
  if(strict){
    ['vocabBook','graduated','meta'].forEach(function(k){if(!isObj(src[k]))throw new Error(k);});
    if(Number(src.version)>=2&&!isObj(src.dayStats))throw new Error('dayStats');
    ['quizLogs','wrongBook','checkins'].forEach(function(k){if(!Array.isArray(src[k]))throw new Error(k);});
  }
  const daily=Number(src.settings.dailyNew);
  if(!isDateStr(src.settings.examDate)||!Number.isInteger(daily)||daily<1||daily>50)throw new Error('settings');
  const out=freshState();
  out.settings={examDate:src.settings.examDate,level:src.settings.level==='CET6'?'CET6':'CET4',dailyNew:daily};
  const wordIds={};WORDS.forEach(function(w){wordIds[w.id]=true;});
  Object.keys(src.wordProgress).forEach(function(id){
    const p=src.wordProgress[id];if(!wordIds[id]||!isObj(p))return;
    const lv=Number(p.lv);if(!Number.isInteger(lv)||lv<0||lv>6||!isDateStr(p.next))return;
    const wt=isObj(p.wt)&&isDateStr(p.wt.d)&&Number.isInteger(Number(p.wt.n))?{d:p.wt.d,n:Math.max(0,Number(p.wt.n))}:{d:todayStr(),n:0};
    out.wordProgress[id]={lv:lv,next:p.next,dealt:p.dealt!==false,wt:wt};
    if(p.sample===true||(src.meta&&src.meta.installedSample===true&&lv===0&&wt.n===0&&p.next<=todayStr()))out.wordProgress[id].sample=true;
  });
  ['vocabBook','graduated'].forEach(function(k){
    const map=isObj(src[k])?src[k]:{};Object.keys(map).forEach(function(id){if(wordIds[id]&&map[id])out[k][id]=true;});
  });
  const validType=function(v){return Object.prototype.hasOwnProperty.call(TYPES,v);};
  const validCause=function(v){return Object.prototype.hasOwnProperty.call(CAUSES,v);};
  out.quizLogs=(Array.isArray(src.quizLogs)?src.quizLogs:[]).filter(function(q){return isObj(q)&&q.id!=null&&isDateStr(q.d)&&validType(q.type)&&Number.isFinite(Number(q.total))&&Number.isFinite(Number(q.correct))&&Number(q.total)>=1&&Number(q.correct)>=0&&Number(q.correct)<=Number(q.total);}).map(function(q){return {id:String(q.id),d:q.d,type:q.type,total:Number(q.total),correct:Number(q.correct),sample:q.sample===true};});
  out.wrongBook=(Array.isArray(src.wrongBook)?src.wrongBook:[]).filter(function(e){return isObj(e)&&e.id!=null&&validType(e.type)&&validCause(e.cause)&&typeof e.ques==='string'&&typeof e.answer==='string'&&Number.isInteger(Number(e.lv))&&Number(e.lv)>=1&&Number(e.lv)<=EINT.length&&isDateStr(e.next)&&isDateStr(e.created);}).map(function(e){return {id:String(e.id),type:e.type,cause:e.cause,ques:e.ques,answer:e.answer,lv:Number(e.lv),next:e.next,created:e.created,sample:e.sample===true,done:e.done===true};});
  out.checkins=Array.from(new Set((Array.isArray(src.checkins)?src.checkins:[]).filter(isDateStr)));
  if(isObj(src.dayStats))Object.keys(src.dayStats).forEach(function(d){const n=Number(src.dayStats[d]);if(isDateStr(d)&&Number.isFinite(n)&&n>=0)out.dayStats[d]=Math.round(n);});
  const meta=isObj(src.meta)?src.meta:{};
  out.meta=Object.assign(out.meta,meta);
  out.meta.installedSample=meta.installedSample===true;
  out.meta.sampleTipDismissed=meta.sampleTipDismissed===true;
  out.meta.placementDone=meta.placementDone===true||(Number(src.version)===1&&(Object.keys(out.wordProgress).length>0||Object.keys(out.graduated).length>0));
  out.meta.dealtDate=isDateStr(meta.dealtDate)?meta.dealtDate:'';
  out.meta.lastOpenDate=isDateStr(meta.lastOpenDate)?meta.lastOpenDate:'';
  out.meta.backupRemindedAt=Number.isFinite(Number(meta.backupRemindedAt))?Number(meta.backupRemindedAt):0;
  out.meta.sampleDates=Array.isArray(meta.sampleDates)?meta.sampleDates.filter(isDateStr):[];
  out.version=SCHEMA_VERSION;
  return out;
}

/* ================= 队列机制 ================= */
function isDue(p,t){return p&&p.lv>=1&&p.next<=t;}
function isInflight(p,t){return p&&p.lv===0&&p.dealt&&p.next<=t;}
function ensureDealt(){
  const t=todayStr();
  if(!learningReady()||state.meta.dealtDate===t)return;
  let inflight=0;
  WORDS.forEach(function(w){const p=state.wordProgress[w.id];if(p&&p.lv===0&&p.dealt)inflight++;});
  let need=Math.max(0,(state.settings.dailyNew||10)-inflight);
  for(let i=0;i<WORDS.length&&need>0;i++){
    const w=WORDS[i],p=state.wordProgress[w.id];
    if(!p||!p.dealt){const np={lv:0,next:t,dealt:true,wt:{d:t,n:0}};if(state.meta.installedSample)np.sample=true;state.wordProgress[w.id]=np;need--;}
  }
  state.meta.dealtDate=t;state.meta.lastOpenDate=t;save();
}
function getQueue(){
  const t=todayStr();
  const due=WORDS.filter(function(w){return isDue(state.wordProgress[w.id],t);})
    .sort(function(a,b){return state.wordProgress[a.id].next<state.wordProgress[b.id].next?-1:1;});
  const inflight=WORDS.filter(function(w){return isInflight(state.wordProgress[w.id],t);});
  return due.slice(0,200).concat(inflight);
}
function dayPlus(){const t=todayStr();state.dayStats[t]=(state.dayStats[t]||0)+1;
  const i=state.meta.sampleDates.indexOf(t);if(i>=0)state.meta.sampleDates.splice(i,1);}
function calcStreak(){
  const set={};state.checkins.forEach(function(d){set[d]=1;});
  const d=new Date();
  if(!set[todayStr(d)])d.setDate(d.getDate()-1);
  let n=0;while(set[todayStr(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function dueErrors(){const t=todayStr();return state.wrongBook.filter(function(e){return !e.done&&e.next<=t;});}
function hasLogToday(){const t=todayStr();return state.quizLogs.some(function(q){return q.d===t;});}
function learnedCount(){let n=0;WORDS.forEach(function(w){const p=state.wordProgress[w.id];if(p&&p.lv>=1)n++;});return n;}
function graduatedCount(){return Object.keys(state.graduated).length;}
function recordTotal(){let n=0;WORDS.forEach(function(w){const p=state.wordProgress[w.id];if(p&&p.lv>=1&&!p.sample)n++;});return state.quizLogs.filter(function(q){return !q.sample;}).length+state.wrongBook.filter(function(e){return !e.sample;}).length+n+graduatedCount();}
function learningReady(){return state.meta.placementDone===true||state.meta.installedSample===true;}

function buildWeek(){
  const t=todayStr();const arr=[];let mx=1;
  for(let i=6;i>=0;i--){const d=addDays(t,-i);const n=state.dayStats[d]||0;arr.push({d:d,n:n});if(n>mx)mx=n;}

  const barMax=110; // 柱子最大像素高度（留出数字+标签空间）
  return '<div class="week">'+arr.map(function(o){
    const dt=new Date(o.d+'T00:00:00');
    const h=Math.max(4,Math.round(o.n/mx*barMax));
    return '<div class="wcol" title="'+o.d+'：复习 '+o.n+' 次">'+
      '<div class="wnum">'+(o.n||'')+'</div>'+
      '<div class="wbar'+(o.n>0?' hot':'')+(o.d===t?' today':'')+'" style="height:'+h+'px"></div>'+
      '<div class="wlab">'+(o.d===t?'今':wd[dt.getDay()])+'</div></div>';
  }).join('')+'</div>';
}
function buildCal(){
  const t=todayStr();
  const today=new Date(t+'T00:00:00');
  const start=new Date(today);
  start.setDate(start.getDate()-34); // 常态展开近 35 天
  start.setDate(start.getDate()-((start.getDay()+6)%7)); // 对齐到周一
  const head=['一','二','三','四','五','六','日'].map(function(d){return '<span class="cal-wd">'+d+'</span>';}).join('');
  let cells='';
  const cur=new Date(start);
  while(cur<=today){
    const ds=todayStr(cur);
    const n=state.dayStats[ds]||0;
    const lv=n===0?'':n<10?'l1':n<16?'l2':'l3';
    cells+='<span class="cal-day '+lv+(ds===t?' today':'')+'" title="'+ds+'：复习 '+n+' 次">'+cur.getDate()+'</span>';
    cur.setDate(cur.getDate()+1);
  }
  let days=0,total=0;
  for(let i=0;i<35;i++){const d=addDays(t,-i);const n=state.dayStats[d]||0;if(n>0){days++;total+=n;}}
  // 月度统计行：本月学习天数 / 共复习次数 / 今日完成
  const thisMonth=t.slice(0,7);
  let mDays=0,mTotal=0;
  for(const d in state.dayStats){if(d.indexOf(thisMonth)===0){mDays++;mTotal+=state.dayStats[d];}}
  const streak=calcStreak();
  return '<div class="cal-streak">已连续 <b>'+streak+'</b> 天 · 在学 '+learnedCount()+' · 已掌握 '+graduatedCount()+' / '+WORDS.length+'</div>'+
    '<div class="cal">'+head+cells+'</div>'+
    '<div class="cal-mini-stats"><span>本月学习 <b>'+mDays+'</b> 天</span><span>共复习 <b>'+mTotal+'</b> 次</span><span>今日 <b>'+(state.dayStats[todayStr()]||0)+'</b> 次</span></div>'+
    '<div class="cal-stats">近 35 天学习 <b>'+days+'</b> 天 · 共复习 <b>'+total+'</b> 次</div>';
}

function answerCard(grade){
  const t=todayStr();
  const w=deck[deckIdx];
  let p=state.wordProgress[w.id];
  if(!p){p={lv:0,next:t,dealt:true,wt:{d:t,n:0}};state.wordProgress[w.id]=p;}
  if(p.sample)delete p.sample;
  dayPlus();
  if(grade==='yes'){
    if(p.lv>=6){state.graduated[w.id]=true;delete state.wordProgress[w.id];}
    else{p.lv++;p.next=addDays(t,WINT[p.lv-1]);p.wt={d:t,n:0};}
    deck.splice(deckIdx,1);
  }else if(grade==='vague'){
    // 模糊：不升级不降级，明天再看，当日不再出现
    p.next=addDays(t,1);
    deck.splice(deckIdx,1);
  }else{
    p.lv=Math.max(0,p.lv-1);
    if(!p.wt||p.wt.d!==t)p.wt={d:t,n:1};else p.wt.n++;
    state.vocabBook[w.id]=true;
    if(p.wt.n>=3){p.lv=0;p.next=addDays(t,1);deck.splice(deckIdx,1);}
    else{p.next=t;deck.push(deck.splice(deckIdx,1)[0]);}
  }
  var _next=p.next||addDays(t,1);
  var _interval=Math.max(0,Math.round((new Date(_next+'T00:00:00')-new Date(t+'T00:00:00'))/86400000));
  pushRemote({date:t,word:w.w,status:(grade==='yes'&&p.lv>=6)?'Mastered':'Learning',interval:_interval,next:_next});
  save();
  if(!deck.length){finishDeck();return;}
  if(deckIdx>=deck.length)deckIdx=0;
  renderCard();
}

/* 按题型汇总全部累计正确率 */
function buildTypeStat(){
  const agg={};let any=false;
  Object.keys(TYPES).forEach(function(k){agg[k]={t:0,c:0};});
  state.quizLogs.forEach(function(q){agg[q.type].t+=q.total;agg[q.type].c+=q.correct;if(q.total>0)any=true;});
  if(!any)return '<div class="muted" style="padding:4px 0;line-height:1.6">记几笔刷题后，这里按题型汇总正确率，一眼看到最弱项。</div>';
  let html='';
  Object.keys(TYPES).forEach(function(k){
    const a=agg[k];if(!a.t)return;
    const pct=Math.round(a.c/a.t*100);
    html+='<div class="cause-row"><span class="nm">'+TYPES[k]+'</span><span class="bar"><i style="width:'+pct+'%;background:'+TYPE_COLORS[k]+'"></i></span><b>'+pct+'%</b></div>';
  });
  return html;
}
function buildChart(){
  const t=todayStr();const days=[];
  for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const agg={};
  state.quizLogs.forEach(function(q){
    if(!agg[q.type])agg[q.type]={};
    if(!agg[q.type][q.d])agg[q.type][q.d]={t:0,c:0};
    agg[q.type][q.d].t+=q.total;agg[q.type][q.d].c+=q.correct;
  });
  const W=620,H=230,PL=36,PR=12,PT=14,PB=30;
  const x=function(i){return PL+(W-PL-PR)*i/13;};
  const y=function(r){return PT+(H-PT-PB)*(1-r/100);};
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:420px;display:block">';
  [0,50,100].forEach(function(r){
    g+='<line x1="'+PL+'" y1="'+y(r)+'" x2="'+(W-PR)+'" y2="'+y(r)+'" stroke="#F1E8DC" stroke-width="1"/>';
    g+='<text x="'+(PL-6)+'" y="'+(y(r)+4)+'" font-size="10" fill="#B7A98F" text-anchor="end">'+r+'%</text>';
  });
  for(let i=0;i<14;i+=2){
    g+='<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" fill="#B7A98F" text-anchor="middle">'+days[i].slice(5)+'</text>';
  }
  Object.keys(TYPES).forEach(function(k){
    const pts=[];
    days.forEach(function(d,i){
      const a=agg[k]&&agg[k][d];
      if(a&&a.t>0)pts.push([x(i),y(a.c/a.t*100)]);
    });
    if(pts.length>1){
      g+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="'+TYPE_COLORS[k]+'" stroke-width="2.5" stroke-linejoin="round"/>';
    }
    pts.forEach(function(p){g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="'+TYPE_COLORS[k]+'"/>';});
  });
  g+='</svg>';
  const has=state.quizLogs.length>0;
  return '<div class="chart-box">'+(has?g:'<div class="muted" style="padding:10px 0">记几笔之后这里会出现折线图。</div>')+'</div>';
}

/* ================= 词汇自测（四题型：看词选义/看义选词/听音选义/拼写检测） ================= */
function sendBack(id){
  // 回炉：降级、回今日队列、进生词本
  const t=todayStr();
  let p=state.wordProgress[id];
  if(!p){p={lv:0,next:t,dealt:true,wt:{d:t,n:0}};state.wordProgress[id]=p;}
  if(p.sample)delete p.sample;
  p.lv=Math.max(0,p.lv-1);p.next=t;p.dealt=true;
  state.vocabBook[id]=true;
  save();
}
function pickDistractors(target,count,key){
  const samePos=WORDS.filter(function(w){return w.id!==target.id&&w.pos===target.pos;});
  let pool=samePos.length>=count?samePos:WORDS.filter(function(w){return w.id!==target.id;});
  // 释义去重：字面相同或互相包含的不做干扰项
  pool=pool.filter(function(w){
    const a=w[key],b=target[key];
    return a!==b&&a.indexOf(b)<0&&b.indexOf(a)<0;
  });
  // 长度接近优先：取最接近的 8 个再随机
  pool.sort(function(a,b){return Math.abs(a[key].length-target[key].length)-Math.abs(b[key].length-target[key].length);});
  return shuffle(pool.slice(0,8)).slice(0,count);
}
function makeQuestion(target,kind){
  let q={kind:kind,target:target,used:[],result:''};
  if(kind==='en2cn'){
    q.prompt=target.w;q.sub=target.ph;
    q.options=shuffle([target].concat(pickDistractors(target,3,'def')));
    q.labelOf=function(w){return w.def;};
  }else if(kind==='cn2en'){
    q.prompt=target.def;q.sub='选择对应的英文单词';
    q.options=shuffle([target].concat(pickDistractors(target,3,'w')));
    q.labelOf=function(w){return w.w;};
  }else if(kind==='audio2'){
    q.prompt='';q.sub='听发音，选择正确的释义';
    q.options=shuffle([target].concat(pickDistractors(target,3,'def')));
    q.labelOf=function(w){return w.def;};
  }else{ // spell 拼写检测
    q.prompt=target.def;q.sub='点字母拼出这个单词（'+target.w.length+' 个字母）';
    q.tiles=shuffle(target.w.split(''));
  }
  return q;
}
function startQuiz(){
  let dealtWords=WORDS.filter(function(w){const p=state.wordProgress[w.id];return p&&p.dealt;});
  let pool=dealtWords.length>=10?dealtWords:WORDS.slice();
  const picked=shuffle(pool.slice()).slice(0,10);
  let kinds=['en2cn','en2cn','en2cn','en2cn','cn2en','cn2en','cn2en','audio2','spell','spell'];
  if(!TTS_OK)kinds[7]='cn2en';
  kinds=shuffle(kinds);
  quizMode={qs:picked.map(function(w,i){return makeQuestion(w,kinds[i]);}),idx:0,right:0,wrongIds:[]};
  render();
}
function renderQuizRun(){
  const qm=quizMode;
  if(qm.idx>=qm.qs.length){
    const wrongWords=qm.wrongIds.map(function(id){const w=WORDS.find(function(x){return x.id===id;});return w?w.w:'';}).filter(Boolean);
    if(!state.meta.quizBest||qm.right>state.meta.quizBest.right)state.meta.quizBest={right:qm.right,d:todayStr()};
    save();
    const html='<div class="card" style="text-align:center"><div class="muted">本轮得分</div>'+
      '<div class="score-big">'+qm.right+'<span style="font-size:22px;color:var(--muted)"> / '+qm.qs.length+'</span></div>'+
      (wrongWords.length?'<div class="muted" style="margin:12px 0">已回炉：'+esc(wrongWords.join('、'))+'</div>':'<div style="margin:12px 0;color:var(--green);font-weight:700">全对，稳</div>')+
      '<div class="row" style="justify-content:center"><button class="btn" onclick="startQuiz()">再来一轮</button>'+
      '<button class="btn gray" onclick="quizMode=null;render()">返回</button></div></div>';
    return html;
  }
  const q=qm.qs[qm.idx];
  const head='<div class="row" style="margin-bottom:14px">'+
    '<div class="muted">自测 '+(qm.idx+1)+' / '+qm.qs.length+'</div>'+
    '<button class="btn sm gray" style="margin-left:auto" onclick="quizMode=null;render()">退出</button></div>';
  if(q.kind==='spell'){
    const ans=q.used.map(function(i){return q.tiles[i];}).join('');
    const ansCls=q.result==='right'?' right':q.result==='wrong'?' wrong':'';
    const body='<div style="text-align:center;padding:6px 0 16px">'+
      '<div style="font-size:24px;font-weight:800">'+esc(q.prompt)+'</div>'+
      '<div class="muted" style="margin-top:8px">'+esc(q.sub)+'</div></div>'+
      '<div class="spell-answer'+ansCls+'">'+(ans||'&nbsp;')+'</div>'+
      '<div class="spell-tiles">'+q.tiles.map(function(ch,i){
        const used=q.used.indexOf(i)>=0;
        return '<button class="tile'+(used?' used':'')+'" '+(used?'disabled aria-disabled="true"':'')+' onclick="spellTap('+i+')">'+ch+'</button>';
      }).join('')+'</div>'+
      (q.result==='wrong'?'<div class="spell-correct">正确拼写：'+esc(q.target.w)+'</div>':'')+
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm gray" onclick="spellBack()">退格</button></div>';
    return '<div class="card">'+head+body+'</div>';
  }
  let promptHtml='';
  if(q.kind==='en2cn')promptHtml='<div style="font-size:38px;font-weight:800">'+esc(q.prompt)+'</div><div class="muted" style="margin-top:8px">'+esc(q.sub)+'</div>';
  else if(q.kind==='cn2en')promptHtml='<div style="font-size:26px;font-weight:800">'+esc(q.prompt)+'</div><div class="muted" style="margin-top:8px">'+esc(q.sub)+'</div>';
  else promptHtml='<button class="speak-btn" style="margin:0 auto" onclick="speak(\''+q.target.w+'\')">'+icon('speaker')+'</button><div class="muted" style="margin-top:12px">'+esc(q.sub)+'</div>';
  if(q.kind==='audio2')setTimeout(function(){speak(q.target.w);},300);
  return '<div class="card">'+head+
    '<div style="text-align:center;padding:14px 0 20px">'+promptHtml+'</div>'+
    q.options.map(function(w,i){
      return '<button class="quiz-opt" id="opt'+i+'" onclick="answerQuiz('+i+')">'+esc(q.labelOf(w))+'</button>';
    }).join('')+'</div>';
}
function answerQuiz(i){
  const qm=quizMode,q=qm.qs[qm.idx];
  const chosen=q.options[i];
  const isRight=chosen.id===q.target.id;
  q.options.forEach(function(w,j){
    const btn=document.getElementById('opt'+j);
    if(!btn)return;
    btn.disabled=true;
    if(w.id===q.target.id)btn.classList.add('right');
    else if(j===i)btn.classList.add('wrong');
  });
  if(isRight){qm.right++;}
  else{qm.wrongIds.push(q.target.id);sendBack(q.target.id);}
  setTimeout(function(){qm.idx++;render();},900);
}
function spellTap(i){
  const qm=quizMode,q=qm.qs[qm.idx];
  if(!q||q.kind!=='spell'||q.result||q.used.indexOf(i)>=0)return;
  q.used.push(i);
  if(q.used.length===q.target.w.length){
    const word=q.used.map(function(x){return q.tiles[x];}).join('');
    if(word===q.target.w){q.result='right';qm.right++;render();setTimeout(function(){qm.idx++;render();},600);}
    else{q.result='wrong';qm.wrongIds.push(q.target.id);sendBack(q.target.id);render();setTimeout(function(){qm.idx++;render();},1500);}
    return;
  }
  render();
}
function spellBack(){
  const q=quizMode.qs[quizMode.idx];
  if(!q||q.kind!=='spell'||q.result)return;
  q.used.pop();render();
}

/* ================= 选词填空（15 选 10，四级阅读 Section A 题型结构） ================= */
let clozeMode=null;
function startCloze(){
  let dealt=WORDS.filter(function(w){const p=state.wordProgress[w.id];return p&&p.dealt;});
  let pool=dealt.length>=10?dealt:WORDS.slice();
  const picked=shuffle(pool.slice()).slice(0,10);
  const distract=shuffle(WORDS.filter(function(w){return !picked.some(function(p){return p.id===w.id;});})).slice(0,5);
  clozeMode={items:picked,bank:shuffle(picked.concat(distract)),placed:{},sel:null,done:false,score:0,wrong:[]};
  render();
}
function renderCloze(){
  const cm=clozeMode;
  if(cm.done){
    const wrongList=cm.wrong.map(function(w){return esc(w.w)+'（'+esc(w.def)+'）';}).join('、');
    return '<div class="card" style="text-align:center"><div class="muted">本组得分</div>'+
      '<div class="score-big">'+cm.score+'<span style="font-size:22px;color:var(--muted)"> / 10</span></div>'+
      (cm.wrong.length?'<div class="muted" style="margin:12px 0;line-height:1.7">填错已回炉：<br>'+wrongList+'</div>':'<div style="margin:12px 0;color:var(--green);font-weight:700">全对，漂亮</div>')+
      '<div class="row" style="justify-content:center"><button class="btn" onclick="startCloze()">再来一组</button>'+
      '<button class="btn gray" onclick="clozeMode=null;render()">返回</button></div></div>';
  }
  const usedIds=Object.keys(cm.placed).map(function(k){return cm.placed[k];});
  const placedCount=usedIds.length;
  let html='<div class="card"><div class="row" style="margin-bottom:12px">'+
    '<div class="muted">选词填空 · 已填 '+placedCount+' / 10</div>'+
    '<button class="btn sm gray" style="margin-left:auto" onclick="clozeMode=null;render()">退出</button></div>'+
    '<div class="bank">'+cm.bank.map(function(w){
      const used=usedIds.indexOf(w.id)>=0;
      return '<button class="chip'+(used?' used':cm.sel===w.id?' sel':'')+'" '+(used?'disabled aria-disabled="true"':'')+' onclick="clozeBankTap('+w.id+')">'+esc(w.w)+'</button>';
    }).join('')+'</div>'+
    cm.items.map(function(w,bi){
      const parts=w.eg.split('___');
      const pid=cm.placed[bi];
      const pw=pid?WORDS.find(function(x){return x.id===pid;}):null;
      return '<div class="cloze-item"><div class="cloze-sent">'+esc(parts[0])+
        '<button class="blank'+(pw?' filled':'')+'" aria-label="第 '+(bi+1)+' 空'+(pw?'，当前 '+esc(pw.w):'，未填写')+'" onclick="clozeBlankTap('+bi+')">'+(pw?esc(pw.w):'&nbsp;')+'</button>'+
        esc(parts[1]||'')+'</div><div class="cloze-cn">'+esc(w.egCn)+'</div></div>';
    }).join('')+
    '<button class="btn block" style="margin-top:14px" '+(placedCount<10?'disabled aria-disabled="true"':'')+' onclick="submitCloze()">提交</button></div>';
  return html;
}
function clozeBankTap(id){
  const cm=clozeMode;
  const used=Object.keys(cm.placed).some(function(k){return cm.placed[k]===id;});
  if(used)return;
  cm.sel=(cm.sel===id)?null:id;
  render();
}
function clozeBlankTap(bi){
  const cm=clozeMode;
  if(cm.placed[bi]){delete cm.placed[bi];}
  else if(cm.sel){cm.placed[bi]=cm.sel;cm.sel=null;}
  render();
}
function submitCloze(){
  const cm=clozeMode;
  let score=0,wrong=[];
  cm.items.forEach(function(w,bi){
    if(cm.placed[bi]===w.id)score++;
    else wrong.push(w);
  });
  wrong.forEach(function(w){sendBack(w.id);});
  if(!state.meta.clozeBest||score>state.meta.clozeBest.score)state.meta.clozeBest={score:score,d:todayStr()};
  cm.done=true;cm.score=score;cm.wrong=wrong;
  save();render();
}

function answerPlacement(known){
  const w=pList[pIdx];
  if(known){pKnown++;pKnownIds.push(w.id);}
  pIdx++;
  if(pIdx>=pList.length){finishPlacement();return;}
  renderPlacement();

function finishPlacement(){
  const rate=pKnown/pList.length;
  const sug=rate<0.3?8:rate<0.6?10:15;
  const t=todayStr();
  pKnownIds.forEach(function(id){
    let p=state.wordProgress[id];
    if(!p||!p.dealt)state.wordProgress[id]={lv:3,next:addDays(t,4),dealt:true,wt:{d:t,n:0}};
    else{if(p.sample)delete p.sample;if(p.lv<3){p.lv=3;p.next=addDays(t,4);}}
  });
  state.settings.dailyNew=sug;
  state.meta.placementDone=true;
  state.meta.dealtDate='';
  save();ensureDealt();
  document.getElementById('deckProg').textContent='';
  document.getElementById('deckBody').innerHTML=
  '<div class="finish-wrap">'+
    '<div style="font-size:22px;font-weight:800">诊断完成</div>'+
    '<div class="score-big" style="margin-top:16px">'+pKnown+'<span style="font-size:22px;color:var(--muted)"> / '+pList.length+'</span></div>'+

}

function addErr(){

    cause:document.getElementById('eCause').value,ques:ques,answer:answer,
    lv:1,next:addDays(todayStr(),EINT[0]),created:todayStr()});

function reviewErr(id){
  const e=state.wrongBook.find(function(x){return x.id===id;});
  if(!e)return;
  if(e.sample)delete e.sample;
  if(e.lv>=EINT.length){e.done=true;}
  else{e.lv++;e.next=addDays(todayStr(),EINT[e.lv-1]);if(e.lv>EINT.length)e.done=true;}
  save();toast(e.done?'这道错题已毕业':'已排到 '+e.next+' 复习');render();

function delErr(id){
  if(!confirm('删除这道错题？'))return;
  state.wrongBook=state.wrongBook.filter(function(x){return x.id!==id;});

/* 下一步建议：基于到期错题/最弱题型/词库进度/连续打卡/临考 动态生成 */
function buildGuide(){
  const streak=calcStreak();
  const grad=graduatedCount(),learned=learnedCount();
  const progPct=Math.round((learned+grad)/WORDS.length*100);
  const errs=dueErrors().length;
  const t=todayStr();
  const examD=Math.max(0,Math.round((new Date(state.settings.examDate+'T00:00:00')-new Date(t+'T00:00:00'))/86400000));
  const agg={};Object.keys(TYPES).forEach(function(k){agg[k]={t:0,c:0};});
  state.quizLogs.forEach(function(q){agg[q.type].t+=q.total;agg[q.type].c+=q.correct;});
  let weak='',weakPct=101;
  Object.keys(TYPES).forEach(function(k){if(agg[k].t>=5){const p=agg[k].c/agg[k].t*100;if(p<weakPct){weakPct=p;weak=k;}}});
  const tips=[];
  if(errs>0)tips.push({n:errs+' 道',txt:'错题今天到期，先清掉再做新题，性价比最高'});
  if(weak)tips.push({n:TYPES[weak],txt:'累计正确率最低（'+Math.round(weakPct)+'%），本周安排 2 套'+TYPES[weak]+'专项'});
  if(progPct<30)tips.push({n:progPct+'%',txt:'词库还在早期，稳住每天新词量，别贪多'});
  else if(progPct<70)tips.push({n:progPct+'%',txt:'词库进度过半在望，保持当前节奏'});
  else tips.push({n:progPct+'%',txt:'词库大头已拿下，重心转向套题模拟与错题复盘'});
  if(streak===0)tips.push({n:'打卡',txt:'今天还没打卡，背完今日队列把连续记录续上'});
  else if(streak<7)tips.push({n:streak+' 天',txt:'连续在记，冲一冲 7 天小里程碑'});
  if(examD<=10)tips.push({n:'D-'+examD,txt:'临近考试：只看到期错题和生词，不再做新题'});
  return tips.slice(0,3).map(function(s){
    return '<div class="guide-row"><span class="chip-n">'+esc(s.n)+'</span><span>'+esc(s.txt)+'</span></div>';
  }).join('');
}
/* 词库掌握度：按艾宾浩斯等级分段的漏斗条 */
function buildLevels(){
  const g={fly:0,l12:0,l34:0,l56:0};let fresh=0;
  const grad=graduatedCount();
  WORDS.forEach(function(w){
    if(state.graduated[w.id])return;
    const p=state.wordProgress[w.id];
    if(!p||!p.dealt){fresh++;return;}
    if(p.lv===0)g.fly++;else if(p.lv<=2)g.l12++;else if(p.lv<=4)g.l34++;else g.l56++;
  });
  const segs=[
    {n:grad,c:'#C2410C',lab:'已掌握'},
    {n:g.l56,c:'#F97316',lab:'后期 L5-6'},
    {n:g.l34,c:'#FB923C',lab:'中期 L3-4'},
    {n:g.l12,c:'#FDBA74',lab:'初期 L1-2'},
    {n:g.fly,c:'#FDE7CE',lab:'新词'},
    {n:fresh,c:'#F5EDE2',lab:'未发放'}
  ];
  let bar='',legend='';
  segs.forEach(function(s){
    if(s.n>0)bar+='<i style="width:'+(s.n/WORDS.length*100).toFixed(1)+'%;background:'+s.c+'" title="'+s.lab+' '+s.n+' 词"></i>';
    legend+='<span><i style="background:'+s.c+'"></i>'+s.lab+' <b>'+s.n+'</b></span>';
  });
  return '<div class="lv-bar">'+bar+'</div><div class="lv-legend">'+legend+'</div>';
}

function makePoster(){
  const t=todayStr();
  const words=state.dayStats[t]||0;
  const streak=calcStreak();
  const prog=Math.round((learnedCount()+graduatedCount())/WORDS.length*100);
  const examD=Math.max(0,Math.round((new Date(state.settings.examDate+'T00:00:00')-new Date(t+'T00:00:00'))/86400000));
  const quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  const cv=document.createElement('canvas');cv.width=750;cv.height=1000;
  const ctx=cv.getContext('2d');
  // 背景
  const grd=ctx.createLinearGradient(0,0,0,1000);
  grd.addColorStop(0,'#F97316');grd.addColorStop(1,'#FB923C');
  ctx.fillStyle=grd;ctx.fillRect(0,0,750,1000);
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='700 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';ctx.fillText('四六级备考台',375,84);
  // 白卡
  ctx.fillStyle='#FFFFFF';
  roundRect(ctx,56,130,638,740,34);ctx.fill();
  // 日期
  ctx.fillStyle='#64748B';ctx.font='24px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(t+' 今日战绩',375,196);
  // 大数字
  ctx.fillStyle='#EA580C';ctx.font='800 150px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(String(words),375,352);
  ctx.fillStyle='#64748B';ctx.font='24px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('今日复习（次）',375,396);
  // 三格数据
  ctx.fillStyle='#1E293B';ctx.font='800 44px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(String(streak),187,512);ctx.fillText(prog+'%',375,512);ctx.fillText(String(examD),563,512);
  ctx.fillStyle='#64748B';ctx.font='21px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('连续天数',187,548);ctx.fillText('词汇进度',375,548);ctx.fillText('距考试天数',563,548);
  // 进度条
  ctx.fillStyle='#FDE7CE';roundRect(ctx,127,596,496,20,10);ctx.fill();
  if(prog>0){ctx.fillStyle='#F97316';roundRect(ctx,127,596,Math.max(20,496*prog/100),20,10);ctx.fill();}
  // 激励语
  ctx.fillStyle='#1E293B';ctx.font='26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  wrapText(ctx,quote,375,706,560,40);
  // 底部
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='22px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('一句话生成的备考工作台',375,930);
  const url=cv.toDataURL('image/png');
  openModal('<h3>今日战绩</h3><img src="'+url+'" alt="战绩海报">'+
    '<div class="muted" style="margin:10px 0;line-height:1.6">微信或 iPhone 上可长按图片保存；电脑上点下方按钮直接下载。</div>'+
    '<button class="btn block" id="posterDl">下载 PNG</button>');
  document.getElementById('posterDl').onclick=function(){
    const a=document.createElement('a');a.href=url;a.download='cet-'+t.replace(/-/g,'')+'.png';
    document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},300);
  };
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapText(ctx,text,x,y,maxW,lineH){
  let line='',yy=y;
  for(let i=0;i<text.length;i++){
    const test=line+text[i];
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=text[i];yy+=lineH;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
}

/* ================= 弹窗 ================= */
let lastModalFocus=null;
function openModal(html){
  lastModalFocus=document.activeElement;
  const body=document.getElementById('modalBody'),mask=document.getElementById('modalMask');
  body.innerHTML=html;mask.classList.add('show');mask.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  setTimeout(function(){const first=body.querySelector('input,button,select,textarea,[tabindex]');(first||body).focus();},0);
}
function closeModal(){
  const mask=document.getElementById('modalMask');mask.classList.remove('show');mask.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  if(lastModalFocus&&document.contains(lastModalFocus))lastModalFocus.focus();
}
document.getElementById('modalMask').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){
  const modal=document.getElementById('modalMask'),deckMask=document.getElementById('deckMask');
  if(e.key==='Escape'){if(modal.classList.contains('show'))closeModal();else if(deckMask.classList.contains('show'))closeDeck();return;}
  if(e.key==='Tab'&&modal.classList.contains('show')){
    const items=[].slice.call(document.getElementById('modalBody').querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')).filter(function(x){return !x.disabled&&x.offsetParent!==null;});
    if(!items.length)return;const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* ================= 渲染入口 ================= */
function render(){
  renderTabbar();
  renderSideToday();
  const streak=calcStreak();
  const pill=document.getElementById('streakPill');
  pill.innerHTML=icon('flame')+'<span>'+(streak>0?'连续 '+streak+' 天':'待打卡')+'</span>';
  pill.classList.toggle('off',streak===0);
  const main=document.getElementById('main');
  if(curTab==='today')main.innerHTML=renderToday();
  else if(curTab==='quiz')main.innerHTML=renderQuizTab();
  else if(curTab==='book')main.innerHTML=renderBook();
  else main.innerHTML=renderMe();
  // 参考信息卡（details.struct）：PC 端强制展开（CSS 同步禁用收起），手机端恢复可折叠
  const wide=window.matchMedia('(min-width:1024px)').matches;
  main.querySelectorAll('details.struct').forEach(function(d){d.open=wide;});
}
try{window.matchMedia('(min-width:1024px)').addEventListener('change',function(){render();});}catch(e){}

/* ================= 高分辨率屏幕自适应等比放大 =================
   设计基准：PC 布局容器宽 1360px（含内边距）。
   视口 CSS 宽超过基准时整页按比例放大（封顶 3 倍），2K/4K/带鱼屏不再留大片空白，
   文字、卡片、间距等比变大，布局结构与 1080p 完全一致；小屏不缩放，不受影响。 */
function applyScreenZoom(){
  var el=document.documentElement;
  if(!('zoom' in el.style))return;   // 不支持 zoom 的浏览器保持原样
  el.style.zoom='';                  // 先还原再量视口，避免累积偏差
  var vw=window.innerWidth;
  var scale=Math.min(Math.max(vw/1360,1),3);
  if(scale===1)return;
  el.style.zoom=scale;
}
window.addEventListener('resize',applyScreenZoom);
applyScreenZoom();

ensureDealt();
render();
pullRemote(function(ok){ if(ok){ render(); } });
